server {
  listen 8080;
  location /api/ { proxy_pass http://control-plane-api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /sdk/v1/loader.js { proxy_pass http://control-plane-api:8000; proxy_set_header Host $host; }
  location = /embed/v1 { proxy_pass http://control-plane-api:8000; proxy_set_header Host $host; }
  location / { root /usr/share/nginx/html; add_header Content-Security-Policy "frame-ancestors 'none'" always; try_files $uri /index.html; }
}
