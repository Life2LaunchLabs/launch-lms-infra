name: Control-plane host

on:
  pull_request:
    paths:
      - deploy/control-plane/ansible/**
      - deploy/control-plane/iac/**
      - deploy/control-plane/state-bootstrap/**
      - deploy/environments/**
      - scripts/environment_topology.py
      - .github/workflows/control-plane-host.yaml
  workflow_dispatch:
    inputs:
      action:
        description: Review or apply cloud/host state
        type: choice
        options: [prepare-state, plan, adopt-plan, apply, configure, verify]
        default: plan
        required: true
      adopt_droplet_id:
        description: Existing droplet ID to import before the first apply
        type: string
        required: false
      adopt_operations_apex_record_id:
        description: Existing life2launch.dev apex record ID; use only for the approved cutover apply
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: control-plane-host
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install host automation dependencies
        run: |
          python -m pip install 'ansible-core>=2.19,<2.20' 'ansible-lint>=25,<26'
      - name: Validate OpenTofu
        run: |
          tofu fmt -check -recursive deploy/control-plane
          tofu -chdir=deploy/control-plane/iac init -backend=false
          tofu -chdir=deploy/control-plane/iac validate
          tofu -chdir=deploy/control-plane/state-bootstrap init -backend=false
          tofu -chdir=deploy/control-plane/state-bootstrap validate
      - name: Validate Ansible
        working-directory: deploy/control-plane/ansible
        run: |
          ansible-playbook --syntax-check bootstrap.yml
          ansible-playbook --syntax-check verify.yml
          ansible-lint bootstrap.yml verify.yml

  prepare-state:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare-state'
    needs: validate
    runs-on: ubuntu-latest
    environment: operations
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_VERSIONING_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_VERSIONING_SECRET_ACCESS_KEY }}
      STATE_BUCKET: ${{ vars.OPERATIONS_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: Enable and verify private state-bucket versioning
        working-directory: deploy/control-plane/state-bootstrap
        run: |
          test -n "$STATE_BUCKET"
          test -n "$SPACES_ACCESS_KEY_ID"
          test -n "$SPACES_SECRET_ACCESS_KEY"
          tofu init
          tofu import -var="bucket_name=$STATE_BUCKET" \
            digitalocean_spaces_bucket.state "sfo3,$STATE_BUCKET"
          tofu apply -auto-approve -var="bucket_name=$STATE_BUCKET"
          tofu plan -detailed-exitcode -var="bucket_name=$STATE_BUCKET"
          echo 'Private state-bucket versioning is enabled.'

  cloud:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'adopt-plan' || inputs.action == 'apply')
    needs: validate
    runs-on: ubuntu-latest
    environment: operations
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://sfo3.digitaloceanspaces.com
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      TF_VAR_ssh_key_names: ${{ vars.OPERATIONS_SSH_KEY_NAMES_JSON }}
      TF_VAR_ssh_source_cidrs: ${{ vars.OPERATIONS_SSH_SOURCE_CIDRS_JSON }}
    defaults:
      run:
        working-directory: deploy/control-plane/iac
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scoped state verifier
        working-directory: deploy/control-plane/state-bootstrap
        run: python -m pip install -r requirements.txt
      - name: Refuse unversioned state bucket
        working-directory: deploy/control-plane/state-bootstrap
        env:
          STATE_BUCKET: ${{ vars.OPERATIONS_STATE_BUCKET }}
        run: python verify_versioning.py
      - name: Initialize locked remote state
        run: tofu init -backend-config="bucket=${{ vars.OPERATIONS_STATE_BUCKET }}"
      - name: Adopt the existing droplet
        if: inputs.action == 'adopt-plan' || (inputs.action == 'apply' && inputs.adopt_droplet_id != '')
        env:
          CONTROL_PLANE_ACTION: ${{ inputs.action }}
          ADOPT_DROPLET_ID: ${{ inputs.adopt_droplet_id }}
        run: |
          if [ "$CONTROL_PLANE_ACTION" = 'adopt-plan' ]; then
            test -n "$ADOPT_DROPLET_ID" || {
              echo 'Existing droplet ID required for adopt-plan' >&2
              exit 1
            }
          fi
          if ! tofu state show digitalocean_droplet.operations >/dev/null 2>&1; then
            tofu import digitalocean_droplet.operations "$ADOPT_DROPLET_ID"
          fi
      - name: Adopt the existing operations apex record
        if: inputs.action == 'apply'
        env:
          APEX_RECORD_ID: ${{ inputs.adopt_operations_apex_record_id }}
        run: |
          if tofu state show 'digitalocean_record.operations_apex[0]' >/dev/null 2>&1; then
            exit 0
          fi
          if grep -Eq '^  operations_apex_cutover: true$' ../../environments/launch-lms.yaml; then
            test -n "$APEX_RECORD_ID" || {
              echo 'Existing .dev apex DNS record ID required before cutover apply' >&2
              exit 1
            }
            tofu import 'digitalocean_record.operations_apex[0]' "life2launch.dev,${APEX_RECORD_ID}"
          fi
      - name: Produce the reviewed plan
        run: tofu plan -lock-timeout=5m -out=control-plane.tfplan
      - name: Apply the reviewed plan
        if: inputs.action == 'apply'
        run: tofu apply -lock-timeout=5m control-plane.tfplan

  host:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'configure' || inputs.action == 'verify')
    needs: validate
    runs-on: ubuntu-latest
    environment: operations
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install host automation dependencies
        run: |
          python -m pip install 'ansible-core>=2.19,<2.20'
      - name: Install the environment-protected SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OPERATIONS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.OPERATIONS_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/operations-key"
          chmod 0600 "$RUNNER_TEMP/operations-key"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/operations-key" > "$RUNNER_TEMP/operations-key.pub"
      - name: Configure the exact repository revision
        if: inputs.action == 'configure'
        working-directory: deploy/control-plane/ansible
        run: >-
          ansible-playbook bootstrap.yml
          --private-key "$RUNNER_TEMP/operations-key"
          --extra-vars "operations_revision=${{ github.sha }}"
          --extra-vars "operations_admin_public_key=$(cat "$RUNNER_TEMP/operations-key.pub")"
      - name: Verify the managed host contract
        working-directory: deploy/control-plane/ansible
        run: ansible-playbook verify.yml --private-key "$RUNNER_TEMP/operations-key"
