name: Cut over Symphony to operations host

on:
  workflow_dispatch:
    inputs:
      action:
        description: Full cutover, or retry only the staged-worker resume after verifying the old host is disabled
        type: choice
        options: [cutover, resume-staged]
        default: cutover
        required: true

permissions:
  contents: read

concurrency:
  group: symphony-host-cutover
  cancel-in-progress: false

jobs:
  pause-and-preserve-legacy:
    if: inputs.action == 'cutover'
    runs-on: ubuntu-latest
    environment: unstable
    steps:
      - name: Stop the idle legacy worker and save its complete home volume
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/launch-lms
            exec 9>.deploy.lock
            flock -w 1200 9
            test "$(cat .deployment-environment)" = unstable
            test -f /etc/launch-symphony/ENABLED
            volume_path="$(docker volume inspect launch-symphony_symphony-home --format '{{.Mountpoint}}')"
            test -d "$volume_path/workspaces"
            test -z "$(find "$volume_path/workspaces" -mindepth 1 -maxdepth 1 -print -quit)" || {
              echo 'Legacy workspaces are not empty; aborting unattended cutover' >&2
              exit 1
            }
            docker compose -f docker-compose.symphony.yml exec -T symphony touch /home/node/PAUSED
            docker compose -f docker-compose.symphony.yml stop symphony
            mkdir -p /var/backups/launch-symphony
            chmod 0700 /var/backups/launch-symphony
            backup="/var/backups/launch-symphony/symphony-home-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            tar -C "$volume_path" -czf "$backup" .
            chmod 0600 "$backup"
            test -s "$backup"
            mv /etc/launch-symphony/ENABLED /etc/launch-symphony/ENABLED.moved-to-operations
            test -z "$(docker compose -f docker-compose.symphony.yml ps -q symphony)"
            echo 'Legacy worker stopped and disabled; encrypted off-host backup remains a separate gate.'

  verify-legacy-inactive:
    needs: pause-and-preserve-legacy
    if: always() && (inputs.action == 'resume-staged' || needs.pause-and-preserve-legacy.result == 'success')
    runs-on: ubuntu-latest
    environment: unstable
    steps:
      - name: Require preserved disable marker and stopped legacy worker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/launch-lms
            test ! -e /etc/launch-symphony/ENABLED
            test -e /etc/launch-symphony/ENABLED.moved-to-operations
            test -z "$(docker compose -f docker-compose.symphony.yml ps -q symphony)"
            test -n "$(find /var/backups/launch-symphony -maxdepth 1 -type f -name 'symphony-home-*.tar.gz' -size +1M -print -quit)"
            echo 'Legacy Symphony is disabled, stopped, and backed up.'

  start-operations-worker:
    needs: verify-legacy-inactive
    if: always() && needs.verify-legacy-inactive.result == 'success'
    runs-on: ubuntu-latest
    environment: operations
    steps:
      - name: Install pinned operations SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OPERATIONS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.OPERATIONS_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/operations-key"
          chmod 0600 "$RUNNER_TEMP/operations-key"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Resume only the staged operations worker
        env:
          OPERATIONS_HOST: ${{ vars.OPERATIONS_HOST }}
          INFRA_REVISION: ${{ github.sha }}
        run: |
          test -n "$OPERATIONS_HOST"
          ssh -i "$RUNNER_TEMP/operations-key" -o IdentitiesOnly=yes "root@${OPERATIONS_HOST}" \
            "INFRA_REVISION=${INFRA_REVISION} bash -c 'set -euo pipefail; exec 9>/var/lock/launch-operations-deploy.lock; flock -w 900 9; cd /opt/launch-operations; runuser -u launchops -- git fetch origin main; runuser -u launchops -- git merge-base --is-ancestor \"\$INFRA_REVISION\" origin/main; runuser -u launchops -- git checkout --detach \"\$INFRA_REVISION\"; bash deploy/control-plane/activate-symphony.sh'"
