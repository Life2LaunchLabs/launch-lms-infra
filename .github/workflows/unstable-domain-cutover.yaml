name: Unstable domain cutover

on:
  workflow_dispatch:
    inputs:
      action:
        description: Apply the nested domain or restore the retained pre-cutover environment
        type: choice
        options: [apply, rollback]
        required: true
      confirmation:
        description: Type unstable.life2launch.app
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-unstable
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: unstable
    steps:
      - uses: actions/checkout@v6
      - name: Validate reviewed request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = unstable.life2launch.app
          python3 scripts/environment_topology.py
      - name: Require unstable connection settings
        env:
          DEPLOY_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_USER: ${{ secrets.DROPLET_USER }}
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_FINGERPRINT"
      - name: Apply reviewed migration with automatic rollback
        uses: appleboy/ssh-action@v1
        env:
          INFRA_REVISION: ${{ github.sha }}
          CUTOVER_ACTION: ${{ inputs.action }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          envs: INFRA_REVISION,CUTOVER_ACTION,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 45m
          script: |
            set -eu
            cd /opt/launch-lms
            exec 9>.deploy.lock
            flock -w 2400 9
            test "$(cat .deployment-environment)" = unstable
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            test "$INFRA_REVISION" = "$(git rev-parse origin/main)"
            git checkout --detach "$INFRA_REVISION"
            export DEPLOY_LOCK_HELD=true
            if [ "$CUTOVER_ACTION" = rollback ]; then
              python3 scripts/migrate-unstable-domain.py rollback
              bash deploy.sh
              python3 scripts/migrate-unstable-domain.py status
              exit 0
            fi
            python3 scripts/migrate-unstable-domain.py apply
            if bash deploy.sh && python3 scripts/verify-public-domain.py && \
                python3 scripts/verify-live-session-handoff.py; then
              python3 scripts/migrate-unstable-domain.py status
              exit 0
            fi
            echo 'Nested-domain verification failed; restoring pre-cutover configuration.' >&2
            python3 scripts/migrate-unstable-domain.py rollback
            bash deploy.sh
            exit 1
