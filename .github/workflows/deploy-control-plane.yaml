name: Deploy control plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: operations
    steps:
      - uses: actions/checkout@v6
      - name: Verify DigitalOcean's existing operations apex A record
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          expected_ip="$(sed -n 's/^  expected_ipv4: //p' deploy/environments/launch-lms.yaml)"
          records="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${DIGITALOCEAN_TOKEN}" \
            'https://api.digitalocean.com/v2/domains/life2launch.dev/records?type=A&per_page=200')"
          if ! jq -e --arg expected "$expected_ip" '
            [.domain_records[] | select(.type == "A" and .name == "@")]
            | if length == 1 and .[0].data == $expected then true else false end
          ' <<<"$records" >/dev/null; then
            echo 'Operations apex A record does not match the protected topology.' >&2
            exit 1
          fi
      - name: Install the pinned operations SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OPERATIONS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.OPERATIONS_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh" "$RUNNER_TEMP/launch-operations-secrets"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/operations-key"
          chmod 0600 "$RUNNER_TEMP/operations-key"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Render validated private runtime files
        env:
          OPERATIONS_POSTGRES_PASSWORD: ${{ secrets.OPERATIONS_POSTGRES_PASSWORD }}
          OPERATIONS_SESSION_SECRET: ${{ secrets.OPERATIONS_SESSION_SECRET }}
          OPERATIONS_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OPERATIONS_GITHUB_OAUTH_CLIENT_ID }}
          OPERATIONS_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OPERATIONS_GITHUB_OAUTH_CLIENT_SECRET }}
          OPERATIONS_GITHUB_APP_ID: ${{ secrets.OPERATIONS_GITHUB_APP_ID }}
          OPERATIONS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OPERATIONS_GITHUB_APP_INSTALLATION_ID }}
          OPERATIONS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OPERATIONS_GITHUB_APP_PRIVATE_KEY }}
          OPERATIONS_JIRA_BASE_URL: ${{ secrets.OPERATIONS_JIRA_BASE_URL }}
          OPERATIONS_JIRA_DELIVERY_EMAIL: ${{ secrets.OPERATIONS_JIRA_DELIVERY_EMAIL }}
          OPERATIONS_JIRA_DELIVERY_TOKEN: ${{ secrets.OPERATIONS_JIRA_DELIVERY_TOKEN }}
          OPERATIONS_JIRA_FEEDBACK_EMAIL: ${{ secrets.OPERATIONS_JIRA_FEEDBACK_EMAIL }}
          OPERATIONS_JIRA_FEEDBACK_TOKEN: ${{ secrets.OPERATIONS_JIRA_FEEDBACK_TOKEN }}
        run: python3 scripts/render-control-plane-runtime.py "$RUNNER_TEMP/launch-operations-secrets"
      - name: Transfer runtime files
        env:
          OPERATIONS_HOST: ${{ vars.OPERATIONS_HOST }}
        run: >-
          scp -i "$RUNNER_TEMP/operations-key" -o IdentitiesOnly=yes
          "$RUNNER_TEMP/launch-operations-secrets/control-plane.env"
          "$RUNNER_TEMP/launch-operations-secrets/postgres.env"
          "$RUNNER_TEMP/launch-operations-secrets/github-app.pem"
          "root@${OPERATIONS_HOST}:/tmp/"
      - name: Deploy the exact protected-branch revision
        env:
          OPERATIONS_HOST: ${{ vars.OPERATIONS_HOST }}
          INFRA_REVISION: ${{ github.sha }}
        run: |
          ssh -i "$RUNNER_TEMP/operations-key" -o IdentitiesOnly=yes "root@${OPERATIONS_HOST}" \
            "INFRA_REVISION=${INFRA_REVISION} bash -s" <<'REMOTE'
          set -euo pipefail
          install -m 0600 -o root -g root /tmp/control-plane.env /etc/launch-operations/control-plane.env
          install -m 0600 -o root -g root /tmp/postgres.env /etc/launch-operations/postgres.env
          install -m 0400 -o 65532 -g 65532 /tmp/github-app.pem /etc/launch-operations/github-app-private-key.pem
          rm -f /tmp/control-plane.env /tmp/postgres.env /tmp/github-app.pem
          cd /opt/launch-operations
          exec 9>/var/lock/launch-operations-deploy.lock
          flock -w 900 9
          runuser -u launchops -- git fetch origin main
          runuser -u launchops -- git merge-base --is-ancestor "$INFRA_REVISION" origin/main
          runuser -u launchops -- git checkout --detach "$INFRA_REVISION"
          bash scripts/deploy-control-plane.sh
          REMOTE
