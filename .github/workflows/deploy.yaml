name: Deploy environment
on:
  push:
    branches: [main]
    paths:
      - release.lock.json
      - docker-compose*.yml
      - Caddyfile
      - caddy.Dockerfile
      - deploy.sh
      - scripts/**
      - .github/workflows/deploy.yaml
  repository_dispatch:
    types: [unstable-candidate]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [unstable, production]
        default: unstable
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy-${{ github.event_name == 'repository_dispatch' && 'unstable' || inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'repository_dispatch' && 'unstable' || inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare validated unstable candidate
        id: candidate
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import base64, importlib.util, json, os
          spec=importlib.util.spec_from_file_location('release_env', 'scripts/release-env.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          value=''
          if os.environ['EVENT']=='repository_dispatch':
              data=module.validate(json.loads(os.environ['PAYLOAD']), 'unstable')
              assert str(data['build_run_id']).isdigit()
              value=base64.b64encode(json.dumps(data).encode()).decode()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('payload='+value+'\n')
          PY
      - name: Require environment-specific connection settings
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_USER: ${{ secrets.DROPLET_USER }}
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_FINGERPRINT"
      - name: Deploy exact infra revision over SSH
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1
        env:
          INFRA_REVISION: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && 'unstable' || inputs.environment || 'production' }}
          CANDIDATE_BASE64: ${{ steps.candidate.outputs.payload }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          envs: INFRA_REVISION,TARGET_ENVIRONMENT,CANDIDATE_BASE64,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 45m
          script: |
            set -eu
            cd /opt/launch-lms
            exec 9>.deploy.lock
            flock -w 2400 9
            test "$(cat .deployment-environment)" = "$TARGET_ENVIRONMENT"
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            git merge-base --is-ancestor "$INFRA_REVISION" origin/main
            git checkout --detach "$INFRA_REVISION"
            export DEPLOY_LOCK_HELD=true
            if [ -n "$CANDIDATE_BASE64" ]; then
              python3 scripts/accept-candidate.py
            fi
            bash deploy.sh
      - name: Observe the running unstable image on its host
        id: observation
        if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'repository_dispatch' || inputs.environment == 'unstable')
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          envs: DEPLOY_RUN_ID,DEPLOY_RUN_ATTEMPT
          capture_stdout: true
          script: |
            set -eu
            cd /opt/launch-lms
            python3 scripts/observe-unstable-deployment.py "$DEPLOY_RUN_ID" "$DEPLOY_RUN_ATTEMPT"
      - name: Validate and save host observation
        if: steps.observation.outcome == 'success'
        env:
          HOST_OBSERVATION: ${{ steps.observation.outputs.stdout }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          INFRA_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          # ssh-action appends its own completion banner after the remote JSON line.
          lines = os.environ['HOST_OBSERVATION'].splitlines()
          assert lines and lines[0].startswith('{')
          value = json.loads(lines[0])
          assert value['schema_version'] == 1 and value['environment'] == 'unstable'
          assert value['deploy_run_id'] == os.environ['DEPLOY_RUN_ID']
          assert value['deploy_run_attempt'] == os.environ['DEPLOY_RUN_ATTEMPT']
          assert value['infra_sha'] == os.environ['INFRA_REVISION']
          pathlib.Path('host-observation.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          PY
      - name: Publish protected host observation
        if: steps.observation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: host-observation-${{ github.run_attempt }}
          path: host-observation.json
          if-no-files-found: error
          retention-days: 30
