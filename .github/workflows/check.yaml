name: Infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/control-plane/api/requirements.txt
      - name: Test environment isolation and refresh guards
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: for script in deploy.sh setup.sh scripts/*.sh; do bash -n "$script"; done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check control-plane web
        working-directory: apps/control-plane/web
        run: bun install --frozen-lockfile && bun run typecheck && bun run build
