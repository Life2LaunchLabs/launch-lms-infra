name: Infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'SQLAlchemy>=2.0,<2.1'
      - name: Test environment isolation and refresh guards
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: for script in deploy.sh setup.sh scripts/*.sh; do bash -n "$script"; done
