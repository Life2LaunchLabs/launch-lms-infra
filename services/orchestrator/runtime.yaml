schema_version: 1
polling:
  interval_ms: 30000
workspace:
  root: /home/node/workspaces
hooks:
  timeout_ms: 180000
agent:
  max_concurrent_agents: 1
  max_turns: 30
  max_retry_backoff_ms: 300000
codex:
  command: codex --config 'shell_environment_policy.inherit="core"' --config 'shell_environment_policy.ignore_default_excludes=false' --config 'shell_environment_policy.filters={ "HOME" = "include", "PATH" = "include", "PWD" = "include", "SHELL" = "include", "USER" = "include", "LOGNAME" = "include", "TERM" = "include", "LANG" = "include", "LC_*" = "include", "TMPDIR" = "include", "CI" = "include", "GIT_*" = "include", "UI_TEST_*" = "include", "UV_CACHE_DIR" = "include" }' --config 'forced_login_method="api"' --config 'model="gpt-5.6-sol"' --config 'model_reasoning_effort="medium"' app-server
  approval_policy: never
  thread_sandbox: danger-full-access
  turn_sandbox_policy:
    type: externalSandbox
    networkAccess: enabled
  turn_timeout_ms: 3600000
server:
  host: 0.0.0.0
  port: 8788
recovery:
  preserve_workspaces: true
  resume_in_progress: true
  reject_stale_head: true
